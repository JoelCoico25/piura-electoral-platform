services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piura_electoral
      POSTGRES_USER: piura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piura_local_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - piura_pgdata:/var/lib/postgresql/data
      - ./database:/workspace/database:ro
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piura -d piura_electoral"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  piura_pgdata:
